<div class="container mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6 flex items-center gap-2">
    <lucide-icon [img]="CreditCard" class="w-6 h-6"></lucide-icon>
    Shopping Cart
  </h1>

  <div *ngIf="isLoading" class="text-center py-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
  </div>

  <div *ngIf="!isLoading && (!cart || !cart.items || cart.items.length === 0)" class="text-center py-12 bg-white rounded-lg shadow">
    <p class="text-gray-500 mb-4">Your cart is empty</p>
    <a routerLink="/products" class="text-blue-600 hover:underline">Continue Shopping</a>
  </div>

  <div *ngIf="!isLoading && cart && cart.items && cart.items.length > 0" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Cart Items -->
    <div class="lg:col-span-2 space-y-4">
      <div *ngFor="let item of cart.items" class="bg-white p-4 rounded-lg shadow flex gap-4 items-center">
        <img [src]="getProductImage(item.productId)" alt="Product" class="w-20 h-20 object-cover rounded bg-gray-100">
        
        <div class="flex-1">
          <h3 class="font-semibold text-lg">{{ getProductName(item.productId) }}</h3>
          <p class="text-blue-600 font-bold">{{ formatPrice(item.unitPrice) }}</p>
        </div>

        <div class="flex items-center gap-3">
          <button (click)="updateQuantity(item, -1)" [disabled]="isProcessing || item.quantity <= 1" class="p-1 rounded hover:bg-gray-100 disabled:opacity-50">
            <lucide-icon [img]="Minus" class="w-4 h-4"></lucide-icon>
          </button>
          <span class="w-8 text-center font-medium">{{ item.quantity }}</span>
          <button (click)="updateQuantity(item, 1)" [disabled]="isProcessing" class="p-1 rounded hover:bg-gray-100 disabled:opacity-50">
            <lucide-icon [img]="Plus" class="w-4 h-4"></lucide-icon>
          </button>
        </div>

        <button (click)="removeItem(item.productId)" [disabled]="isProcessing" class="text-red-500 hover:text-red-700 p-2">
          <lucide-icon [img]="Trash2" class="w-5 h-5"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Order Summary -->
    <div class="lg:col-span-1">
      <div class="bg-white p-6 rounded-lg shadow sticky top-4">
        <h2 class="text-xl font-bold mb-4">Order Summary</h2>
        
        <div class="flex justify-between mb-2">
          <span class="text-gray-600">Subtotal</span>
          <span class="font-semibold">{{ formatPrice(cart.total) }}</span>
        </div>
        
        <div class="border-t my-4 pt-4">
          <div class="flex justify-between mb-6">
            <span class="text-lg font-bold">Total</span>
            <span class="text-lg font-bold text-blue-600">{{ formatPrice(cart.total) }}</span>
          </div>

          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Payment Method</label>
            <select [(ngModel)]="selectedPaymentMethod" class="w-full p-2 border rounded-md">
              <option value="WAVE">Wave</option>
              <option value="ORANGE_MONEY">Orange Money</option>
              <option value="CASH_ON_DELIVERY">Cash on Delivery</option>
              <option value="PAYPAL">PayPal</option>
              <option value="DEBIT_CARD">Credit Card</option>
            </select>
          </div>

          <button (click)="checkout()" [disabled]="isProcessing" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
            {{ isProcessing ? 'Processing...' : 'Place Order' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
